<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EncryptCo Installer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .box {
      text-align: center;
      padding: 40px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111827;
      width: 320px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    a.button {
      display: inline-block;
      padding: 12px 18px;
      background: #22c55e;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.2s;
    }

    a.button:hover {
      background: #16a34a;
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>EncryptCo Installer</h1>
    <p>Download and run the setup script to install EncryptCo.</p>

    <a class="button"
       href="https://raw.githubusercontent.com/andomatthew1234/encryptco/main/installer.bat"
       download>
       Download Installer
    </a>

    <div class="small">
      If your browser warns you, choose “Keep file”.
    </div>
  </div>

</body>
</html>
